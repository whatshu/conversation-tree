services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: conversation_tree
      POSTGRES_PASSWORD: conversation_tree
      POSTGRES_DB: conversation_tree
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conversation_tree -d conversation_tree"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.main"]
    env_file:
      - .env
    environment:
      CT_SERVICE_ROLE: api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker_entry"]
    env_file:
      - .env
    environment:
      CT_SERVICE_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
