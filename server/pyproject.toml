[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-tree-server"
version = "0.1.0"
description = "Conversation tree backend powered by FastAPI, LangGraph, and PostgreSQL."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langgraph>=0.2.50",
  "pydantic-settings>=2.6.0",
  "psycopg[binary]>=3.2.1",
  "sqlalchemy>=2.0.36",
  "sse-starlette>=2.1.3",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]
